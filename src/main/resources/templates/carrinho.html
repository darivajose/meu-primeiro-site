<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clube do Livro - Carrinho</title>
    <style>
        body { background-color: #121212; color: #FFD700; font-family: Arial, sans-serif; margin: 20px; }
        header { border-bottom: 1px solid #FFD700; padding-bottom: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border: 1px solid #FFD700; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #FFD700; border-bottom: 2px solid #FFD700; }
        .total { font-size: 1.5em; text-align: right; margin-top: 20px; color: #00ff66; }
        .btn { background: #FFD700; color: #000; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
<header>
    <h1>🛒 Seu Carrinho de Compras</h1>
</header>

<table th:if="${#lists.size(carrinho) > 0}">
    <thead>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>Preço</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${carrinho}">
        <td th:text="${item.titulo}">Título</td>
        <td th:text="${item.autor}">Autor</td>
        <td th:text="'R$ ' + ${#numbers.formatDecimal(item.preco, 1, 2)}">R$ 0,00</td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(carrinho)}">Seu carrinho está vazio.</p>

<div class="total" th:if="${#lists.size(carrinho) > 0}">
    Total: R$ <span th:text="${#numbers.formatDecimal(total, 1, 2)}">0,00</span>
</div>

<a href="/" class="btn">Continuar Comprando</a>
</body>
</html>
