<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Painel Administrativo - Clube do Livro</title>
  <style>
    body { background-color: #121212; color: #FFD700; font-family: Arial, sans-serif; margin: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #FFD700; padding-bottom: 10px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #1e1e1e; border: 1px solid #FFD700; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #FFD700; border-bottom: 2px solid #FFD700; }
    .btn { background: #FFD700; color: #000; padding: 8px 15px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; }
    .btn-danger { background: #ff4d4d; color: #fff; }
    .btn-edit { background: #00ccff; color: #000; }
  </style>
</head>
<body>
<header>
  <h1>⚙️ Painel Administrativo de Livros</h1>
  <div>
    <a href="/admin/livros/novo" class="btn">➕ Cadastrar Novo Livro</a>
    <a href="/" class="btn" style="background:#555; color:#fff;">Voltar para Loja</a>
  </div>
</header>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Título</th>
    <th>Autor</th>
    <th>Categoria</th>
    <th>Preço</th>
    <th>Ações</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="livro : ${livros}">
    <td th:text="${livro.id}">1</td>
    <td th:text="${livro.titulo}">Título</td>
    <td th:text="${livro.autor}">Autor</td>
    <td th:text="${livro.categoria}">Categoria</td>
    <td th:text="'R$ ' + ${#numbers.formatDecimal(livro.preco, 1, 2)}">R$ 0,00</td>
    <td>
      <a th:href="@{/admin/livros/editar/{id}(id=${livro.id})}" class="btn btn-edit">Editar</a>
      <a th:href="@{/admin/livros/excluir/{id}(id=${livro.id})}" class="btn btn-danger" onclick="return confirm('Confirma a exclusão deste livro?')">Excluir</a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
