<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro / Edição de Livro</title>
  <style>
    body { background-color: #121212; color: #FFD700; font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 50px; margin: 0; }
    .form-card { background-color: #1e1e1e; border: 1px solid #FFD700; border-radius: 8px; padding: 30px; width: 400px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select { width: 95%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #FFD700; background: #000; color: #fff; }
    button { background: #FFD700; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 20px; }
    a { color: #FFD700; text-decoration: none; font-size: 0.9em; display: block; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
<div class="form-card">
  <h2 th:text="${livro.id != null} ? '✏️ Editar Livro' : '📖 Cadastrar Livro'"></h2>
  <form th:action="@{/admin/livros/salvar}" th:object="${livro}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Título:</label>
    <input type="text" th:field="*{titulo}" required />

    <label>Autor:</label>
    <input type="text" th:field="*{autor}" required />

    <label>Categoria:</label>
    <input type="text" th:field="*{categoria}" placeholder="Ex: Fantasia, Ficção, Clássicos" required />

    <label>Preço:</label>
    <input type="number" step="0.01" th:field="*{preco}" required />

    <label>URL da Capa:</label>
    <input type="url" th:field="*{capaUrl}" placeholder="https://..." />

    <button type="submit">Salvar Livro</button>
  </form>
  <a href="/admin/livros">Cancelar e Voltar</a>
</div>
</body>
</html>
