<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clube do Livro - Vitrine</title>
    <style>
        body { background-color: #121212; color: #FFD700; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #1e1e1e; border-bottom: 2px solid #FFD700; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5em; font-weight: bold; color: #FFD700; text-decoration: none; }

        .search-box input { padding: 8px 12px; border-radius: 4px; border: 1px solid #FFD700; background: #000; color: #fff; }
        .search-box button { padding: 8px 15px; background: #FFD700; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }

        nav a { color: #FFD700; text-decoration: none; margin-left: 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }

        .categorias { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .btn-categoria { background: #1e1e1e; color: #FFD700; border: 1px solid #FFD700; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.9em; }
        .btn-categoria:hover { background: #FFD700; color: #000; }

        .grid-livros { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1100px; margin: 0 auto; padding: 20px; }
        .card-livro { background-color: #1e1e1e; border: 1px solid #FFD700; border-radius: 8px; width: 220px; padding: 15px; text-align: center; }
        .card-livro img { width: 100%; height: 260px; object-fit: cover; border-radius: 4px; }
        .titulo { font-size: 1.1em; margin: 10px 0 5px 0; }
        .autor { color: #ccc; font-size: 0.9em; margin-bottom: 10px; }
        .preco { font-size: 1.3em; font-weight: bold; color: #00ff66; margin-bottom: 15px; }
        .btn-comprar { background: #FFD700; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-comprar:hover { background: #e6c200; }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">📚 Clube do Livro</a>

    <form action="/" method="get" class="search-box">
        <input type="text" name="busca" placeholder="Pesquisar título ou autor..." />
        <button type="submit">Buscar</button>
    </form>

    <nav>
        <a href="/">Início</a>
        <a href="/carrinho">🛒 Carrinho (<span th:text="${carrinhoQtd}">0</span>)</a>
        <a href="/login">👤 Entrar</a>
    </nav>
</header>

<div class="categorias">
    <a href="/" class="btn-categoria">Todos</a>
    <a href="/?categoria=Fantasia" class="btn-categoria">Fantasia</a>
    <a href="/?categoria=Ficção" class="btn-categoria">Ficção</a>
    <a href="/?categoria=Clássicos" class="btn-categoria">Clássicos</a>
</div>

<main class="grid-livros">
    <div class="card-livro" th:each="livro : ${livros}">
        <img th:src="${livro.capaUrl != null && !livro.capaUrl.empty} ? ${livro.capaUrl} : 'https://via.placeholder.com/200x260?text=Sem+Capa'" alt="Capa" />
        <h3 class="titulo" th:text="${livro.titulo}">Título</h3>
        <p class="autor" th:text="${livro.autor}">Autor</p>
        <div class="preco" th:text="'R$ ' + ${#numbers.formatDecimal(livro.preco, 1, 2)}">R$ 0,00</div>
        <form th:action="@{/carrinho/adicionar/{id}(id=${livro.id})}" method="post">
            <button type="submit" class="btn-comprar">Adicionar ao Carrinho</button>
        </form>
    </div>
</main>

</body>
</html>
