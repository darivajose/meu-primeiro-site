<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Clube do Livro - Login</title>
  <style>
    body { background-color: #121212; color: #FFD700; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background-color: #1e1e1e; border: 1px solid #FFD700; border-radius: 8px; padding: 30px; width: 300px; text-align: center; }
    input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #FFD700; background: #000; color: #fff; }
    button { background: #FFD700; color: #000; border: none; padding: 10px; width: 98%; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
    a { color: #FFD700; text-decoration: none; font-size: 0.9em; display: block; margin-top: 15px; }
  </style>
</head>
<body>
<div class="login-card">
  <h2>🔑 Entrar</h2>
  <form action="/login" method="post">
    <input type="email" name="email" placeholder="Seu e-mail" required />
    <input type="password" name="senha" placeholder="Sua senha" required />
    <button type="submit">Acessar</button>
  </form>
  <a href="/">Voltar para a vitrine</a>
</div>
</body>
</html>
